general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.cache/waybar/lockscreen-wallpaper
    color = rgb(02040c)
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
}

label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 72
    font_family = FiraCode Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(ffb4aa)
    inner_color = rgba(02040cdd)
    font_color = rgb(ffffff)
    check_color = rgb(add8e6)
    fail_color = rgb(ff6b6b)
    fade_on_empty = false
    placeholder_text = <i>Digite sua senha</i>
    fail_text = <i>Senha incorreta</i>
    rounding = 12
    position = 0, -20
    halign = center
    valign = center
}
